name: neurovector-sim

services:
  sim:
    build:
      context: ./docker
      args:
        BASE_IMAGE: ${SIM_BASE_IMAGE:-px4io/px4-sitl-gazebo-ros2:latest}
    image: neurovector-sim:${SIM_IMAGE_TAG:-local}
    container_name: nv-sim
    # ROS 2 DDS / MAVLink / Foxglove 포트를 호스트에서 그대로 사용
    network_mode: host
    # Fast DDS 공유메모리 + Gazebo /dev/shm 사용을 위해 호스트 IPC 공유
    ipc: host
    stdin_open: true
    tty: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      PX4_SIM_MODEL: ${PX4_SIM_MODEL:-gz_x500_depth}
      PX4_GZ_WORLD: ${PX4_GZ_WORLD:-default}
      # GUI 를 쓰려면 0, 헤드리스(CI/원격)는 1
      HEADLESS: ${HEADLESS:-0}
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
      # 소프트웨어 렌더링 폴백이 필요하면 1
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-0}
    volumes:
      - ./ros2_ws:/ros2_ws
      - ./config:/config:ro
      - ./logs:/root/.local/share/px4/rootfs/fs/log
      # Gazebo / RViz2 GUI 용 X11 소켓 (호스트에서 `make x11` 먼저 실행)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: ["bash", "-l"]
