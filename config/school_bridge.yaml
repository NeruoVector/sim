# School world only; the default-world bridge remains available separately.
- ros_topic_name: /camera/image_raw
  gz_topic_name: /world/school/model/x500_depth_0/link/camera_link/sensor/IMX214/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true
  publisher_queue: 1
- ros_topic_name: /camera/camera_info
  gz_topic_name: /world/school/model/x500_depth_0/link/camera_link/sensor/IMX214/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true
  publisher_queue: 1
- ros_topic_name: /camera/depth/image_raw
  gz_topic_name: /depth_camera
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true
  publisher_queue: 1
- ros_topic_name: /camera/depth/points
  gz_topic_name: /depth_camera/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true
  publisher_queue: 1
- ros_topic_name: /sim/odometry
  gz_topic_name: /model/x500_depth_0/odometry_with_covariance
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.OdometryWithCovariance
  direction: GZ_TO_ROS
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
